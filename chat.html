<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask a Question | Ayush AI Automation</title>
  <meta name="description" content="Ask about the AI products, Managed Automation, pricing, setup and WhatsApp requirements.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ai-system.css">
<style>body{padding-top:0}</style>
<style>
.chat-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto;padding:14px 16px;background:rgba(9,14,28,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(96,165,250,.16)}
.chat-back{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;color:var(--primary-light);background:rgba(59,130,246,.1);border:1px solid rgba(96,165,250,.24);flex-shrink:0;transition:background .22s}
.chat-back:hover{background:rgba(59,130,246,.2)}
.chat-back svg{width:17px;height:17px}
.chat-id{display:flex;align-items:center;gap:10px;min-width:0}
.chat-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.8);flex-shrink:0;animation:chat-live 2.4s ease-in-out infinite}
@keyframes chat-live{0%,100%{opacity:1}50%{opacity:.45}}
.chat-id strong{display:block;color:var(--primary-light);font-size:.98rem;line-height:1.25}
.chat-id em{display:block;color:var(--text-soft);font-size:.76rem;font-style:normal;line-height:1.3}
.chat-shell{max-width:820px;margin:0 auto;padding:0 16px 20px;display:flex;flex-direction:column;height:calc(100vh - 66px);min-height:420px}
.chat-log{flex:1;overflow-y:auto;padding:20px 4px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{max-width:82%;padding:14px 17px;border-radius:16px;line-height:1.72;font-size:0.95rem;white-space:pre-wrap;word-wrap:break-word;animation:msg-in .28s ease both}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:linear-gradient(160deg,rgba(17,18,34,.9),rgba(26,42,80,.5));border:1px solid var(--ai-line);border-bottom-left-radius:5px;color:var(--text-soft)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-bottom-right-radius:5px}
.msg strong{color:var(--text-main);font-weight:600}
.msg.user strong{color:#fff}
.msg em{font-style:normal;opacity:.72;font-size:.9em}
.chat-typing{align-self:flex-start;display:flex;gap:5px;padding:15px 18px;background:rgba(17,18,34,.9);border:1px solid var(--ai-line);border-radius:16px;border-bottom-left-radius:5px}
.chat-typing span{width:7px;height:7px;border-radius:50%;background:var(--primary-light);animation:dot 1.3s infinite}
.chat-typing span:nth-child(2){animation-delay:.16s}
.chat-typing span:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chat-chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 4px}
.chat-chip{background:rgba(59,130,246,.08);border:1px solid var(--ai-line);color:var(--ai-blue-soft);border-radius:20px;padding:8px 15px;font-size:.82rem;font-family:inherit;cursor:pointer;transition:background .22s,border-color .22s}
.chat-chip:hover{background:rgba(59,130,246,.16);border-color:var(--ai-line-strong)}
.chat-chip:focus-visible{outline:2px solid var(--primary-light);outline-offset:2px}
.chat-input-row{display:flex;gap:10px;padding:14px 4px 0;border-top:1px solid rgba(255,255,255,.06)}
.chat-input-row input{flex:1;background:rgba(11,16,32,.8);border:1px solid var(--ai-line);border-radius:24px;padding:14px 18px;color:var(--text-main);font-size:.95rem;font-family:inherit}
.chat-input-row input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
.chat-send{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border:none;border-radius:50%;width:48px;height:48px;min-width:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s,box-shadow .22s}
.chat-send:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(59,130,246,.42)}
.chat-send:focus-visible{outline:2px solid var(--primary-light);outline-offset:3px}
.chat-send svg{width:20px;height:20px;stroke:#fff}
@media (max-width:768px){.chat-shell{height:calc(100vh - 62px);padding:0 12px 14px}.msg{max-width:91%;font-size:.89rem;padding:12px 14px}.chat-top{padding:11px 13px}.chat-chip{font-size:.78rem;padding:7px 13px}.chat-input-row input{padding:12px 16px;font-size:.92rem}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.chat-typing span{animation:none}.chat-send:hover{transform:none}}
</style>
</head>
<body data-root="" data-bare>


<header class="chat-top">
  <a href="index.html" class="chat-back" aria-label="Back to site">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="chat-id">
    <span class="chat-dot" aria-hidden="true"></span>
    <div>
      <strong>Ayush AI Automation</strong>
      <em>Ask about products, pricing or setup</em>
    </div>
  </div>
</header>

<div class="chat-shell">
  <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="Conversation"></div>
  <div class="chat-chips" id="chat-chips"></div>
  <form class="chat-input-row" id="chat-form">
    <label for="chat-input" class="ai-vh">Type your question</label>
    <input type="text" id="chat-input" placeholder="Ask about pricing, products, setup…" autocomplete="off">
    <button type="submit" class="chat-send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>



<script src="site-data.js"></script>
<script src="main.js"></script>
<script src="ui.js"></script>
<script src="script.js"></script>
<script>
(function () {
  var log   = document.getElementById("chat-log");
  var chips = document.getElementById("chat-chips");
  var form  = document.getElementById("chat-form");
  var input = document.getElementById("chat-input");
  var BOT   = window.AAA_CHAT;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function fmt(s){
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/_(.+?)_/g,"<em>$1</em>");
  }

  function add(text, who){
    var d = document.createElement("div");
    d.className = "msg " + who;
    d.innerHTML = fmt(text);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function typing(on){
    var t = document.getElementById("typing");
    if (on && !t){
      t = document.createElement("div");
      t.className = "chat-typing"; t.id = "typing";
      t.innerHTML = "<span></span><span></span><span></span>";
      log.appendChild(t);
      log.scrollTop = log.scrollHeight;
    } else if (!on && t){ t.remove(); }
  }

  function ask(text){
    add(text, "user");
    typing(true);
    setTimeout(function(){
      typing(false);
      add(BOT ? BOT.respond(text)
              : "The assistant didn't load. Message Ayush on WhatsApp: +91 94772 93867", "bot");
    }, reduce ? 0 : 480);
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var v = input.value.trim();
    if (!v) return;
    input.value = "";
    ask(v);
  });

  if (BOT){
    BOT.suggestions.forEach(function(s){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chat-chip"; b.textContent = s;
      b.addEventListener("click", function(){ ask(s); });
      chips.appendChild(b);
    });
    add(BOT.respond("hi"), "bot");
  } else {
    add("The assistant didn't load properly. You can reach Ayush directly on WhatsApp: +91 94772 93867", "bot");
  }
})();
</script>
</body>
</html>
