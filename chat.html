<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AI Assistant – Ayush AI Automation</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --bg:         #0b1020;
      --bg2:        #121a33;
      --cyan:       #00e5ff;
      --cyan-dim:   rgba(0,229,255,0.12);
      --cyan-glow:  rgba(0,229,255,0.35);
      --purple:     #a855f7;
      --blue:       #3b82f6;
      --blue-dark:  #1e40af;
      --text:       #e2e8f0;
      --text-soft:  #8892a4;
      --border:     rgba(0,229,255,0.1);
      --border-hot: rgba(0,229,255,0.38);
      --surface:    rgba(18,28,58,0.75);
      --radius:     18px;
      --header-h:   64px;
      --input-h:    72px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 0%,   rgba(0,229,255,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(168,85,247,0.05) 0%, transparent 60%);
    }

    .shell {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 720px;
      margin: 0 auto; position: relative; z-index: 1;
    }

    .blob { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; }
    .blob-1 { width:420px; height:420px; background:rgba(0,229,255,0.055); top:-160px; left:-120px; }
    .blob-2 { width:340px; height:340px; background:rgba(168,85,247,0.055); bottom:-100px; right:-80px; }

    /* ── Header ───────────────────────────────────────── */
    .header {
      flex-shrink: 0; height: var(--header-h);
      display: flex; align-items: center; gap: 12px;
      padding: 0 18px;
      background: rgba(11,16,32,0.92);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      position: relative; z-index: 20;
    }
    .back-btn {
      width:36px; height:36px; border-radius:50%;
      border:1px solid var(--border-hot); background:var(--cyan-dim);
      color:var(--cyan); display:flex; align-items:center; justify-content:center;
      text-decoration:none; transition:all 0.2s; flex-shrink:0;
    }
    .back-btn:hover { background:var(--cyan-glow); transform:scale(1.08); }
    .back-btn svg   { width:15px; height:15px; }
    .header-logo {
      width:38px; height:38px; border-radius:50%; object-fit:cover;
      border:1.5px solid var(--cyan-glow); box-shadow:0 0 10px var(--cyan-dim); flex-shrink:0;
    }
    .header-info { flex:1; min-width:0; }
    .header-name {
      font-family:'Syne',sans-serif; font-weight:700; font-size:0.95rem;
      background:linear-gradient(120deg,var(--cyan),var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .header-sub {
      display:flex; align-items:center; gap:5px;
      font-size:0.74rem; color:var(--text-soft); margin-top:1px;
    }
    .dot-live {
      width:6px; height:6px; border-radius:50%;
      background:#22c55e; box-shadow:0 0 5px #22c55e;
      animation:pulse-live 2s ease infinite;
    }
    @keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .header-badge {
      font-size:0.72rem; padding:4px 10px;
      border:1px solid rgba(168,85,247,0.4); border-radius:20px;
      background:rgba(168,85,247,0.1); color:var(--purple);
      font-weight:600; letter-spacing:0.3px; flex-shrink:0;
    }

    /* ── Messages ─────────────────────────────────────── */
    .messages {
      flex:1; overflow-y:auto; padding:20px 14px 10px;
      display:flex; flex-direction:column; gap:12px;
      scroll-behavior:smooth; position:relative; z-index:1;
    }
    .messages::-webkit-scrollbar { width:3px; }
    .messages::-webkit-scrollbar-thumb { background:var(--border-hot); border-radius:3px; }
    .messages { scrollbar-width:thin; scrollbar-color:var(--border-hot) transparent; }

    /* ── Welcome ──────────────────────────────────────── */
    .welcome {
      display:flex; flex-direction:column; align-items:center;
      padding:32px 16px 20px; gap:14px; animation:fadeUp 0.5s ease both;
    }
    .welcome-img {
      width:68px; height:68px; border-radius:50%; object-fit:cover;
      border:2px solid var(--border-hot); box-shadow:0 0 28px var(--cyan-glow);
    }
    .welcome-title {
      font-family:'Syne',sans-serif; font-weight:800; font-size:1.2rem;
      background:linear-gradient(120deg,var(--cyan),var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      text-align:center;
    }
    .welcome-desc {
      font-size:0.85rem; color:var(--text-soft); text-align:center;
      max-width:280px; line-height:1.65;
    }
    .welcome-chips {
      display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-top:4px;
    }
    .welcome-chip {
      padding:6px 13px; border:1px solid var(--border); border-radius:20px;
      font-size:0.78rem; color:var(--text-soft); background:var(--surface);
      cursor:pointer; transition:all 0.18s;
    }
    .welcome-chip:hover {
      border-color:var(--border-hot); color:var(--cyan); background:var(--cyan-dim);
      transform:translateY(-1px);
    }

    /* ── Mode selector ────────────────────────────────── */
    .mode-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
    .mode-btn {
      padding:7px 16px; border-radius:20px; font-size:0.8rem; font-weight:600;
      cursor:pointer; transition:all 0.18s;
      border:1px solid var(--border-hot); background:var(--cyan-dim); color:var(--cyan);
    }
    .mode-btn:hover { background:var(--cyan-glow); transform:translateY(-1px); }
    .mode-btn.faq-btn {
      border-color:rgba(168,85,247,0.5); background:rgba(168,85,247,0.1); color:var(--purple);
    }
    .mode-btn.faq-btn:hover { background:rgba(168,85,247,0.22); }

    /* date separator */
    .date-sep {
      text-align:center; font-size:0.72rem; color:var(--text-soft);
      display:flex; align-items:center; gap:10px; letter-spacing:0.4px;
    }
    .date-sep::before, .date-sep::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── Bubble row ───────────────────────────────────── */
    .msg {
      display:flex; align-items:flex-end; gap:8px;
      max-width:86%; animation:fadeUp 0.28s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .msg.bot  { align-self:flex-start; }
    .msg.user { align-self:flex-end; flex-direction:row-reverse; }

    .av {
      width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0;
      border:1.5px solid var(--border-hot); box-shadow:0 0 8px var(--cyan-dim);
    }

    .bubble {
      padding:11px 15px; border-radius:var(--radius);
      font-size:0.9rem; line-height:1.68; white-space:pre-wrap; word-break:break-word;
      position:relative;
    }
    .msg.bot .bubble {
      background:var(--surface); border:1px solid var(--border);
      border-bottom-left-radius:4px; box-shadow:0 2px 18px rgba(0,0,0,0.28);
    }
    .msg.bot .bubble::after {
      content:''; position:absolute; left:-7px; bottom:8px;
      border:7px solid transparent; border-right-color:rgba(18,28,58,0.75);
      border-left:0; border-bottom:0;
    }
    .msg.user .bubble {
      background:linear-gradient(135deg,rgba(0,229,255,0.18),rgba(59,130,246,0.22));
      border:1px solid rgba(0,229,255,0.25); border-bottom-right-radius:4px; color:var(--text);
    }

    /* ── CTA link ─────────────────────────────────────── */
    .cta-link {
      display:inline-flex; align-items:center; gap:6px; margin-top:10px;
      padding:8px 14px;
      background:linear-gradient(135deg,rgba(0,229,255,0.14),rgba(59,130,246,0.18));
      border:1px solid var(--border-hot); border-radius:12px;
      color:var(--cyan); font-size:0.83rem; font-weight:600;
      text-decoration:none; transition:all 0.2s;
    }
    .cta-link:hover { background:var(--cyan-glow); transform:translateY(-1px); }
    .cta-link svg   { width:14px; height:14px; flex-shrink:0; }

    /* ── Typing indicator ─────────────────────────────── */
    .typing-row {
      display:flex; align-items:flex-end; gap:8px; align-self:flex-start;
      animation:fadeUp 0.2s ease both;
    }
    .typing-dots {
      display:flex; align-items:center; gap:4px; padding:12px 16px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); border-bottom-left-radius:4px;
    }
    .typing-dots span {
      width:6px; height:6px; border-radius:50%; background:var(--text-soft);
      animation:bounce 1.2s ease infinite;
    }
    .typing-dots span:nth-child(2){ animation-delay:0.2s; }
    .typing-dots span:nth-child(3){ animation-delay:0.4s; }
    @keyframes bounce {
      0%,60%,100%{ transform:translateY(0); }
      30%        { transform:translateY(-6px); }
    }

    /* ── Follow-up question bubble ────────────────────── */
    .followup-bubble {
      align-self:flex-start; padding:9px 14px; margin-left:38px;
      background:rgba(0,229,255,0.06); border:1px solid rgba(0,229,255,0.18);
      border-radius:14px; border-bottom-left-radius:4px;
      font-size:0.85rem; color:var(--text-soft); font-style:italic;
      animation:fadeUp 0.3s ease both; max-width:80%;
    }

    /* ── Quick reply chips ────────────────────────────── */
    .quick-row {
      display:flex; flex-wrap:wrap; gap:7px; align-self:flex-start;
      animation:fadeUp 0.3s ease both; padding-left:38px;
    }
    .qchip {
      padding:6px 13px; border:1px solid var(--border); border-radius:20px;
      font-size:0.78rem; color:var(--text-soft); background:var(--surface);
      cursor:pointer; transition:all 0.18s;
    }
    .qchip:hover { border-color:var(--border-hot); color:var(--cyan); background:var(--cyan-dim); }

    /* ── FAQ chip row ─────────────────────────────────── */
    .faq-chip-row {
      display:flex; flex-wrap:wrap; gap:7px; align-self:flex-start;
      animation:fadeUp 0.3s ease both; padding-left:38px;
    }
    .faq-chip {
      padding:6px 13px; border:1px solid rgba(168,85,247,0.35); border-radius:20px;
      font-size:0.78rem; color:var(--purple); background:rgba(168,85,247,0.08);
      cursor:pointer; transition:all 0.18s;
    }
    .faq-chip:hover { background:rgba(168,85,247,0.18); border-color:rgba(168,85,247,0.6); }

    /* ── Floating action row ──────────────────────────── */
    .float-row {
      display:flex; flex-wrap:wrap; gap:7px; align-self:flex-start;
      padding-left:38px; animation:fadeUp 0.3s ease both;
    }
    .float-btn {
      padding:6px 13px; border-radius:20px; font-size:0.78rem; font-weight:600;
      cursor:pointer; transition:all 0.18s;
      border:1px solid var(--border-hot); background:var(--cyan-dim); color:var(--cyan);
      text-decoration:none;
    }
    .float-btn:hover { background:var(--cyan-glow); }
    .float-btn.faq { border-color:rgba(168,85,247,0.4); background:rgba(168,85,247,0.08); color:var(--purple); }
    .float-btn.faq:hover { background:rgba(168,85,247,0.2); }

    /* ── Input bar ────────────────────────────────────── */
    .input-bar {
      flex-shrink:0; height:var(--input-h);
      display:flex; align-items:center; gap:10px; padding:0 14px;
      background:rgba(11,16,32,0.95); backdrop-filter:blur(20px);
      border-top:1px solid var(--border); position:relative; z-index:10;
    }
    .chat-input {
      flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px;
      padding:11px 16px; color:var(--text); font-family:inherit; font-size:0.92rem;
      outline:none; resize:none; transition:border-color 0.2s, box-shadow 0.2s;
    }
    .chat-input::placeholder { color:var(--text-soft); }
    .chat-input:focus { border-color:var(--border-hot); box-shadow:0 0 0 3px var(--cyan-dim); }
    .send-btn {
      width:44px; height:44px; border-radius:50%;
      background:linear-gradient(135deg,#00c6d7,#3b82f6);
      border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all 0.2s; flex-shrink:0; box-shadow:0 4px 16px rgba(0,229,255,0.32);
    }
    .send-btn:hover  { transform:scale(1.08); box-shadow:0 6px 22px rgba(0,229,255,0.48); }
    .send-btn:active { transform:scale(0.94); }
    .send-btn svg    { width:19px; height:19px; }

    /* ── Mobile tweaks ────────────────────────────────── */
    @media (max-width:480px) {
      :root { --header-h:58px; --input-h:66px; }
      .header { padding:0 12px; gap:9px; }
      .messages { padding:14px 10px 8px; gap:10px; }
      .msg { max-width:91%; }
      .header-badge { display:none; }
    }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="shell">

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="back-btn" title="Back to Home">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <img src="logo.png" alt="logo" class="header-logo">
    <div class="header-info">
      <div class="header-name">Ayush AI Automation</div>
      <div class="header-sub">
        <span class="dot-live"></span>
        AI Assistant · Always Online
      </div>
    </div>
    <div class="header-badge">✦ AI</div>
  </header>

  <!-- Messages -->
  <main class="messages" id="msgs">

    <!-- Welcome card -->
    <div class="welcome" id="welcomeEl">
      <img src="logo.png" alt="" class="welcome-img">
      <div class="welcome-title">Ayush AI Automation</div>
      <p class="welcome-desc">Ask me anything about Instagram &amp; WhatsApp automation for fitness coaches 🤖</p>

      <div class="mode-row">
        <button class="mode-btn" onclick="enterServiceMode()">⚙️ Service Guide</button>
        <button class="mode-btn faq-btn" onclick="enterFaqMode()">❓ FAQs</button>
      </div>

      <div class="welcome-chips" id="welcomeChips">
        <span class="welcome-chip" data-q="What is the pricing?">💰 Pricing</span>
        <span class="welcome-chip" data-q="Show me a demo">🎥 Demo</span>
        <span class="welcome-chip" data-q="How does the system work?">⚙️ How it works</span>
        <span class="welcome-chip" data-q="Is it safe for Instagram?">🛡️ Is it safe?</span>
        <span class="welcome-chip" data-q="How to get started?">🚀 Get Started</span>
        <span class="welcome-chip" data-q="What if I get no results?">📊 Results</span>
      </div>
    </div>

    <div class="date-sep" id="dateSep" style="display:none">Today</div>

  </main>

  <!-- Input bar -->
  <footer class="input-bar">
    <input
      type="text"
      class="chat-input"
      id="chatInput"
      placeholder="Ask anything about automation…"
      autocomplete="off"
      maxlength="300"
      enterkeyhint="send"
    >
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </footer>

</div>

<!-- Data (MUST load before script.js) -->
<script src="AGENCY_DATA.js"></script>
<!-- Chatbot Engine v8 -->
<script src="script.js"></script>
<script>
  /* ════════════════════════════════════════════════════════════
     CHAT DELIVERY ENGINE v8
     Wires up all intelligence systems from script.js v8:
       - smartDelay() — length-proportional typing delays
       - intelligentSplit() — multi-bubble delivery
       - shouldHesitate() — 8% hesitation illusion
       - followUp questions — per-intent, 70% rate
       - proactive re-engagement — 90s silence timer
       - returning user greeting — localStorage-aware
       - CTA suppression — session-aware, max 3
  ════════════════════════════════════════════════════════════ */

  const msgsEl    = document.getElementById("msgs");
  const inputEl   = document.getElementById("chatInput");
  const sendBtn   = document.getElementById("sendBtn");
  const welcomeEl = document.getElementById("welcomeEl");
  const dateSep   = document.getElementById("dateSep");

  let firstMsg    = true;
  let isBusy      = false;
  let currentMode = "service";

  const LOGO           = "logo.png";
  const GET_STARTED_URL = "https://ayushaiautomation.vercel.app/book.html";

  // Proactive re-engagement timer
  let reengageTimer = null;
  const REENGAGE_DELAY = 90000; // 90 seconds silence

  /* ── FAQ display labels ───────────────────────────────── */
  const FAQ_LABELS = {
    faq_dm_setup              : "📲 DM Setup",
    faq_lead_qualification    : "🎯 Lead Qualification",
    faq_tagging               : "🏷️ Tagging System",
    faq_followup_auto         : "🔁 Follow-up Automation",
    faq_comment_dm            : "💬 Comment-to-DM",
    faq_story_reply           : "📸 Story Automation",
    faq_booking_funnel        : "📅 Booking Funnel",
    faq_whatsapp_qualification: "💚 WA Qualification",
    faq_reengagement          : "♻️ Re-engagement",
    faq_hot_lead              : "🔥 Hot Lead Alert",
    faq_no_daily_manage       : "🤖 No Daily Management",
    faq_spam                  : "🚫 Will It Spam?",
    faq_technical_knowledge   : "🧠 Technical Knowledge",
    faq_organic_ads           : "📈 Organic vs Ads",
    faq_manychat_subscription : "⚙️ ManyChat Subscription",
    faq_support               : "🛎️ Support",
    faq_stop_service          : "🚪 Cancel/Stop",
  };

  /* ── Helpers ──────────────────────────────────────────── */
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function fmt(s) {
    return esc(s)
      .replace(/•\s(.+)/g, '<span style="display:block;padding-left:10px">• $1</span>')
      .replace(/\n/g, "<br>");
  }
  function scrollEnd() {
    setTimeout(() => msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior:"smooth" }), 60);
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ── Re-engagement timer management ──────────────────── */
  function resetReengageTimer() {
    if (reengageTimer) clearTimeout(reengageTimer);
    if (isBusy || firstMsg) return;
    reengageTimer = setTimeout(async () => {
      if (!isBusy && !firstMsg) {
        const msg = CHATBOT.buildReengagement();
        if (msg) {
          isBusy = true;
          showTyping();
          await sleep(CHATBOT.smartDelay(msg));
          hideTyping();
          addBot(msg, null, null, false); // no follow-up on re-engage
          isBusy = false;
        }
      }
    }, REENGAGE_DELAY);
  }

  /* ── Hide welcome ─────────────────────────────────────── */
  function hideWelcome() {
    if (!firstMsg) return;
    welcomeEl.style.display = "none";
    dateSep.style.display   = "";
    firstMsg = false;
  }

  /* ── Append user bubble ───────────────────────────────── */
  function addUser(text) {
    const d = document.createElement("div");
    d.className = "msg user";
    d.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    msgsEl.appendChild(d);
    scrollEnd();
  }

  /* ── Typing indicator ─────────────────────────────────── */
  function showTyping() {
    const el    = document.createElement("div");
    el.className = "typing-row"; el.id = "typingEl";
    el.innerHTML = `<img src="${LOGO}" class="av" alt=""><div class="typing-dots"><span></span><span></span><span></span></div>`;
    msgsEl.appendChild(el); scrollEnd();
  }
  function hideTyping() { document.getElementById("typingEl")?.remove(); }

  /* ── Append bot bubble ────────────────────────────────── */
  function addBot(text, link, cta, showFloatBtns = true) {
    const d    = document.createElement("div");
    d.className = "msg bot";
    const ctaHtml = link && cta
      ? `<br><a class="cta-link" href="${link}" target="_blank" rel="noopener">
           <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
             <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5-5 5M6 12h12"/>
           </svg>${esc(cta)}
         </a>`
      : "";
    d.innerHTML = `<img src="${LOGO}" class="av" alt=""><div class="bubble">${fmt(text)}${ctaHtml}</div>`;
    msgsEl.appendChild(d); scrollEnd();
    return d;
  }

  /* ── Follow-up question bubble ────────────────────────── */
  function addFollowUp(text) {
    const d    = document.createElement("div");
    d.className = "followup-bubble";
    d.textContent = text;
    msgsEl.appendChild(d); scrollEnd();
  }

  /* ── Quick reply chips ────────────────────────────────── */
  const QUICK = [
    { l:"💰 Pricing",     q:"What is the pricing?" },
    { l:"🎥 Demo",        q:"Show me a demo" },
    { l:"🚀 Get Started", q:"How to get started?" },
  ];
  function addQuick() {
    const row = document.createElement("div");
    row.className = "quick-row";
    QUICK.forEach(o => {
      const c = document.createElement("span");
      c.className = "qchip"; c.textContent = o.l;
      c.onclick = () => { row.remove(); send(o.q); };
      row.appendChild(c);
    });
    msgsEl.appendChild(row); scrollEnd();
  }

  /* ── FAQ chips ────────────────────────────────────────── */
  function addFaqChips(keys) {
    const row = document.createElement("div");
    row.className = "faq-chip-row";
    keys.forEach(key => {
      const label = FAQ_LABELS[key] || key;
      const c     = document.createElement("span");
      c.className = "faq-chip"; c.textContent = label;
      c.onclick   = () => { row.remove(); showFaqAnswer(CHATBOT.getFaq(key)); };
      row.appendChild(c);
    });
    msgsEl.appendChild(row); scrollEnd();
  }

  /* ── Floating action buttons ──────────────────────────── */
  function addFloatBtns(showFaq = true) {
    const row = document.createElement("div");
    row.className = "float-row";

    if (showFaq) {
      const faqBtn    = document.createElement("span");
      faqBtn.className = "float-btn faq";
      faqBtn.textContent = "❓ More FAQs";
      faqBtn.onclick  = () => { row.remove(); showFaqList(); };
      row.appendChild(faqBtn);
    }

    const gsBtn     = document.createElement("a");
    gsBtn.className = "float-btn";
    gsBtn.textContent = "🚀 Get Started";
    gsBtn.href      = GET_STARTED_URL;
    gsBtn.target    = "_blank";
    gsBtn.rel       = "noopener";
    row.appendChild(gsBtn);

    msgsEl.appendChild(row); scrollEnd();
  }

  /* ── Show FAQ list ────────────────────────────────────── */
  function showFaqList() {
    hideWelcome();
    addBot("Here are the most common questions — tap any for an instant answer 👇", null, null, false);
    const keys = CHATBOT.getTopFaqs(10);
    setTimeout(() => addFaqChips(keys), 300);
  }

  /* ── Show FAQ answer ──────────────────────────────────── */
  async function showFaqAnswer(resp) {
    if (!resp) return;
    hideWelcome();
    isBusy = true;
    showTyping();
    await sleep(CHATBOT.smartDelay(resp.text));
    hideTyping();
    addBot(resp.text, resp.link, resp.cta, false);
    await sleep(280);
    addFloatBtns(true);
    isBusy = false;
    resetReengageTimer();
  }

  /* ── Mode: Service ────────────────────────────────────── */
  function enterServiceMode() {
    currentMode = "service";
    hideWelcome();
    send("How does the system work?");
  }

  /* ── Mode: FAQ ────────────────────────────────────────── */
  function enterFaqMode() {
    currentMode = "faq";
    hideWelcome();
    dateSep.style.display = "";
    showFaqList();
  }

  /* ════════════════════════════════════════════════════════
     CORE DELIVERY ENGINE v8
     Implements: smartDelay, multi-bubble, hesitation,
     follow-up question injection, floating buttons
  ════════════════════════════════════════════════════════ */
  async function deliverResponse(resp) {
    // ── Hesitation illusion (8% rate, after turn 2) ──────
    if (CHATBOT.shouldHesitate()) {
      showTyping();
      await sleep(380 + Math.random() * 220);
      hideTyping();
      addBot(CHATBOT.getHesitationLine(), null, null, false);
      await sleep(260 + Math.random() * 160);
    }

    // ── Intelligent response splitting ───────────────────
    const segments = CHATBOT.intelligentSplit(resp.text);

    for (let i = 0; i < segments.length; i++) {
      const isLast = i === segments.length - 1;
      const seg    = segments[i];

      showTyping();
      await sleep(CHATBOT.smartDelay(seg));
      hideTyping();

      // Link/CTA only on last segment
      if (isLast) {
        addBot(seg, resp.link, resp.cta, false);
      } else {
        addBot(seg, null, null, false);
        // Brief natural pause between bubbles
        await sleep(180 + Math.random() * 160);
      }
    }

    // ── Follow-up question (injected as italic bubble) ───
    if (resp.followUp) {
      await sleep(500 + Math.random() * 300);
      addFollowUp(resp.followUp);
    }

    // ── Floating action buttons ──────────────────────────
    await sleep(260);
    addFloatBtns(true);

    // ── Quick chips on fallback ──────────────────────────
    if (resp.text.includes("rephrase") || resp.text.includes("specific")) {
      await sleep(200);
      addQuick();
    }
  }

  /* ════════════════════════════════════════════════════════
     MAIN SEND FUNCTION
  ════════════════════════════════════════════════════════ */
  async function send(override) {
    const raw = override || inputEl.value.trim();
    if (!raw || isBusy) return;

    isBusy = true;
    if (!override) inputEl.value = "";

    // Cancel re-engage timer — user is active
    if (reengageTimer) clearTimeout(reengageTimer);

    hideWelcome();
    addUser(raw);

    // Get response from brain
    const resp = CHATBOT.process(raw, currentMode === "faq" ? "faq" : "service");

    // Deliver with full multi-bubble + smart delay engine
    await deliverResponse(resp);

    isBusy = false;

    // Reset re-engagement timer after each reply
    resetReengageTimer();
  }

  /* ── Events ───────────────────────────────────────────── */
  sendBtn.onclick  = () => send();
  inputEl.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };

  // Any input activity resets re-engagement timer
  inputEl.addEventListener("input", () => {
    if (reengageTimer) clearTimeout(reengageTimer);
  });

  document.getElementById("welcomeChips").querySelectorAll(".welcome-chip").forEach(c => {
    c.onclick = () => send(c.dataset.q);
  });

  /* ── Init + auto greeting ─────────────────────────────── */
  CHATBOT.init().then(() => {
    setTimeout(async () => {
      // Use the brain's greeting builder (handles returning users)
      const greetResp = CHATBOT.process("hi");

      // Smart delay even for greeting
      showTyping();
      await sleep(CHATBOT.smartDelay(greetResp.text));
      hideTyping();

      const segments = CHATBOT.intelligentSplit(greetResp.text);
      for (let i = 0; i < segments.length; i++) {
        const isLast = i === segments.length - 1;
        addBot(segments[i], isLast ? greetResp.link : null, isLast ? greetResp.cta : null, false);
        if (!isLast) await sleep(160 + Math.random() * 140);
      }
    }, 600);

    inputEl.focus();
  });
</script>

</body>
</html>
