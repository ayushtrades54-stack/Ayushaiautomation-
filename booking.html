<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<title>Book Your Automation Setup – Ayush AI Automation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter, sans-serif;
background:radial-gradient(circle at top,#0f172a,#020617 70%);
color:white;
margin:0;
}

.container{
max-width:700px;
margin:120px auto;
padding:30px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
backdrop-filter:blur(12px);
}

h1{text-align:center;}
p{text-align:center;color:#94a3b8;}

input,textarea,select{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.03);
color:white;
}

button{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:999px;
background:linear-gradient(135deg,#38bdf8,#0ea5e9);
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h1>Book Your Automation Setup</h1>
<p>Fill this form and our team will contact you shortly.</p>

<form action="https://formsubmit.co/ayushtrades54@gmail.com" method="POST">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Automation Client Lead">
<input type="hidden" name="_template" value="table">

<input type="text" name="Name" placeholder="Your Name" required>
<input type="text" name="Business" placeholder="Business Name" required>
<input type="text" name="Instagram" placeholder="Instagram Username">
<input type="tel" name="WhatsApp" placeholder="WhatsApp Number" required>

<select name="Monthly Leads">
<option value="">Monthly Leads</option>
<option>0–50</option>
<option>50–200</option>
<option>200–500</option>
<option>500+</option>
</select>

<select name="Budget">
<option value="">Monthly Budget</option>
<option>₹1k–₹3k</option>
<option>₹3k–₹10k</option>
<option>₹10k+</option>
</select>

<textarea name="Goal" rows="4" placeholder="What do you want to automate? (DMs, Calls, Sales, Support etc.)"></textarea>

<button type="submit">Submit & Get Started</button>
</form>

</div>
<script src="main.js"></script>
</body>
</html>
