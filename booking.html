<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<title>Book Your Fitness DM Automation Setup – Ayush AI Automation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Book your Instagram & WhatsApp DM Automation setup for Fitness Coaches. Turn inquiries into booked calls and paying clients on autopilot.">

<style>
body{
font-family:Inter, sans-serif;
background:radial-gradient(circle at top,#0f172a,#020617 70%);
color:white;
margin:0;
}

.container{
max-width:700px;
margin:120px auto;
padding:30px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
backdrop-filter:blur(12px);
}

h1{text-align:center;}
p{text-align:center;color:#94a3b8;}

input,textarea,select{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.03);
color:white;
}

button{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:999px;
background:linear-gradient(135deg,#38bdf8,#0ea5e9);
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h1>Book Your Fitness Coach Automation Setup</h1>
<p>
This system is built for online fitness coaches who want more
booked calls and clients from Instagram & WhatsApp DMs.
</p>

<form action="https://formsubmit.co/ayushtrades54@gmail.com" method="POST">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Fitness Coach Automation Lead">
<input type="hidden" name="_template" value="table">

<input type="text" name="Coach Name" placeholder="Your Name" required>
<input type="text" name="Brand" placeholder="Fitness Brand / Page Name" required>
<input type="text" name="Instagram" placeholder="Instagram Username" required>
<input type="tel" name="WhatsApp" placeholder="WhatsApp Number" required>

<select name="Coaching Type" required>
<option value="">Type of Coaching</option>
<option>Fat Loss</option>
<option>Muscle Building</option>
<option>Transformation Programs</option>
<option>Online Personal Training</option>
<option>Offline Gym / Studio</option>
</select>

<select name="Monthly Leads" required>
<option value="">Monthly DM Inquiries</option>
<option>0–50</option>
<option>50–200</option>
<option>200–500</option>
<option>500+</option>
</select>

<select name="Current Offer" required>
<option value="">What Do You Sell?</option>
<option>1-on-1 Coaching</option>
<option>Group Program</option>
<option>High Ticket Transformation</option>
<option>Membership</option>
</select>

<textarea name="Main Goal" rows="4" placeholder="What do you want to automate? (Lead replies, qualification, call booking, follow-ups, payment links, etc.)"></textarea>

<button type="submit">Submit & Book Free Setup Call</button>
</form>

</div>

<script src="main.js"></script>
</body>
</html>
